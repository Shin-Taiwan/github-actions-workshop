name: Test
on:
  pull_request:
    paths: ['go/**/*.go']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: Run tests
        run: go test go/excellent/*.go